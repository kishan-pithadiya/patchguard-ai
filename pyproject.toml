[project]
name = "patchguard"
version = "1.0.0"
description = "PatchGuard AI: Autonomous DevSecOps & Self-Healing SRE Remediation Engine"
readme = "README.md"
authors = [
    { name = "PatchGuard AI Contributors" }
]
requires-python = ">=3.12"
dependencies = [
    "crewai>=0.80",
    "python-dotenv>=1.2.2",
    "streamlit>=1.57",
]

[project.scripts]
patchguard = "patchguard:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
audit = [
    "pip-audit>=2.9.0",
]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "audit" },
    "prek>=0.5.3",
]
lint = [
    "ruff>=0.16.3",
    "ty>=0.0.82",
]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",
    "COM812",
    "ISC001",
    "INP001",
    "CPY",
    "EM",
    "TRY003",
    "TC003",
    "BLE001",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004", "ANN"]
"streamlit_app.py" = ["INP001", "C901", "PLR0912", "PLR0915"]
"src/patchguard/graph.py" = ["TRY300", "PLR0913"]

[tool.ruff.lint.isort]
known-first-party = ["patchguard"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=patchguard",
    "--cov-report=term-missing",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
]

[tool.coverage.run]
branch = true
source = ["src/patchguard"]
omit = [
    "*/__main__.py",
    "*/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@abstractmethod",
]
show_missing = true

[tool.ty.terminal]
error-on-warning = true

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
# Strict on our symbols. Lenient on third-party stub gaps (CrewAI / LangGraph).
possibly-unresolved-reference = "error"
unused-ignore-comment = "warn"
invalid-argument-type = "ignore"
unresolved-attribute = "ignore"
pydantic-discarded-extra-argument = "ignore"
